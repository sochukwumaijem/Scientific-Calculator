<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using math.js for robust mathematical evaluation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="input-container">
                <div class="input" id="input">0</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="toggle-group">
                <button id="deg-rad-btn">RAD</button>
            </div>
            <div class="brand">SUMA</div>
        </div>

        <div class="keypad">
            <!-- Scientific Functions Panel -->
            <div class="scientific-pad">
                <button class="btn sci" data-val="sin(">sin</button>
                <button class="btn sci" data-val="cos(">cos</button>
                <button class="btn sci" data-val="tan(">tan</button>
                
                <button class="btn sci" data-val="asin(">sin⁻¹</button>
                <button class="btn sci" data-val="acos(">cos⁻¹</button>
                <button class="btn sci" data-val="atan(">tan⁻¹</button>
                
                <button class="btn sci" data-val="log(">log</button>
                <button class="btn sci" data-val="ln(">ln</button>
                <button class="btn sci" data-val="e">e</button>
                
                <button class="btn sci" data-val="^">x^y</button>
                <button class="btn sci" data-val="sqrt(">√</button>
                <button class="btn sci" data-val="!">x!</button>
                
                <button class="btn sci" data-val="pi">π</button>
                <button class="btn sci" data-val="(">(</button>
                <button class="btn sci" data-val=")">)</button>
            </div>

            <!-- Main Number and Operator Panel -->
            <div class="main-pad">
                <button class="btn action" id="clear">AC</button>
                <button class="btn action" id="delete">DEL</button>
                <button class="btn op" data-val="%">%</button>
                <button class="btn op" data-val="/">÷</button>

                <button class="btn num" data-val="7">7</button>
                <button class="btn num" data-val="8">8</button>
                <button class="btn num" data-val="9">9</button>
                <button class="btn op" data-val="*">×</button>

                <button class="btn num" data-val="4">4</button>
                <button class="btn num" data-val="5">5</button>
                <button class="btn num" data-val="6">6</button>
                <button class="btn op" data-val="-">−</button>

                <button class="btn num" data-val="1">1</button>
                <button class="btn num" data-val="2">2</button>
                <button class="btn num" data-val="3">3</button>
                <button class="btn op" data-val="+">+</button>

                <button class="btn num zero" data-val="0">0</button>
                <button class="btn num" data-val=".">.</button>
                <button class="btn equals" id="equals">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
